[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kindle-mcp-dashboard"
version = "0.1.0"
description = "MCP-controlled e-ink dashboard for the Kindle Paperwhite EY21"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.12,<2",
  "Pillow>=11,<13",
  "psutil>=7,<8",
]

[project.scripts]
kindle-dashboard = "kindle_mcp_dashboard.cli:main"
kindle-dashboard-mcp = "kindle_mcp_dashboard.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
